[package]
name = "manga-reader"
version = "0.1.0"
description = "A local-first desktop comic and manga reader"
edition = "2021"

[lib]
name = "manga_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
