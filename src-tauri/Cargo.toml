[package]
name = "manga-reader"
version = "0.4.0"
description = "A local-first desktop comic and manga reader"
edition = "2021"

[lib]
name = "manga_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-dialog = { version = "2.8.3", default-features = false, features = ["gtk3"] }
uuid = { version = "1.28.0", default-features = false, features = ["v4"] }
serde_json = "1.0.154"
rawzip = "0.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
